<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Gold movie ticket">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d96a0"/>
      <stop offset="0.45" stop-color="#f4f7fa"/>
      <stop offset="0.55" stop-color="#f4f7fa"/>
      <stop offset="1" stop-color="#7e8791"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="cut">
      <rect x="30" y="70" width="340" height="160" rx="14" fill="#fff"/>
      <circle cx="30" cy="150" r="20" fill="#000"/>
      <circle cx="370" cy="150" r="20" fill="#000"/>
      <circle cx="292" cy="70" r="9" fill="#000"/>
      <circle cx="292" cy="230" r="9" fill="#000"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g transform="rotate(-7 200 150)">
    <g filter="url(#shadow)">
      <rect x="30" y="70" width="340" height="160" rx="14" fill="url(#metal)" mask="url(#cut)"/>
    </g>
    <g mask="url(#cut)">
      <rect x="-40" y="60" width="90" height="190" fill="url(#shine)" transform="rotate(18 200 150)" opacity="0.8"/>
    </g>
    <rect x="46" y="84" width="232" height="132" rx="8" fill="none" stroke="#2f3740" stroke-opacity="0.45" stroke-width="2"/>
    <line x1="292" y1="84" x2="292" y2="216" stroke="#2f3740" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
    <text x="62" y="112" font-family="'Arial Black', 'Arial', 'Helvetica', sans-serif" font-size="15" font-weight="900" letter-spacing="4" fill="#2f3740">ADMIT ONE</text>
    <text x="62" y="204" font-family="'Arial Black', 'Arial', 'Helvetica', sans-serif" font-size="20" font-weight="900" letter-spacing="2" fill="#2f3740">GOLD</text>
    <g>
      <circle cx="222" cy="150" r="40" fill="#5d6670" opacity="0.85"/>
      <polygon points="222.0,118.0 230.2,139.7 253.4,140.8 235.3,155.3 241.4,177.7 222.0,165.0 202.6,177.7 208.7,155.3 190.6,140.8 213.8,139.7" fill="#f6c343" stroke="#9a6b00" stroke-width="3" stroke-linejoin="round"/>
