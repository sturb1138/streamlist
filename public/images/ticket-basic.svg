<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Basic movie ticket">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a4520"/>
      <stop offset="0.45" stop-color="#e0a86e"/>
      <stop offset="0.55" stop-color="#e0a86e"/>
      <stop offset="1" stop-color="#6b3a18"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="cut">
      <rect x="30" y="70" width="340" height="160" rx="14" fill="#fff"/>
      <circle cx="30" cy="150" r="20" fill="#000"/>
      <circle cx="370" cy="150" r="20" fill="#000"/>
      <circle cx="292" cy="70" r="9" fill="#000"/>
      <circle cx="292" cy="230" r="9" fill="#000"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g transform="rotate(-7 200 150)">
    <g filter="url(#shadow)">
      <rect x="30" y="70" width="340" height="160" rx="14" fill="url(#metal)" mask="url(#cut)"/>
    </g>
    <g mask="url(#cut)">
      <rect x="-40" y="60" width="90" height="190" fill="url(#shine)" transform="rotate(18 200 150)" opacity="0.8"/>
    </g>
    <rect x="46" y="84" width="232" height="132" rx="8" fill="none" stroke="#3d200b" stroke-opacity="0.45" stroke-width="2"/>
    <line x1="292" y1="84" x2="292" y2="216" stroke="#3d200b" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
    <text x="62" y="112" font-family="'Arial Black', 'Arial', 'Helvetica', sans-serif" font-size="15" font-weight="900" letter-spacing="4" fill="#3d200b">ADMIT ONE</text>
    <text x="62" y="204" font-family="'Arial Black', 'Arial', 'Helvetica', sans-serif" font-size="20" font-weight="900" letter-spacing="2" fill="#3d200b">BASIC</text>
    <g transform="translate(222 150)">
      <circle r="38" fill="#4a2a10" opacity="0.9"/>
      <circle r="30" fill="#c98a4f"/>
      <circle r="6" fill="#4a2a10"/>
      <circle cx="0" cy="-17" r="8" fill="#4a2a10"/>
      <circle cx="16.2" cy="-5.3" r="8" fill="#4a2a10"/>
      <circle cx="10" cy="13.8" r="8" fill="#4a2a10"/>
      <circle cx="-10" cy="13.8" r="8" fill="#4a2a10"/>
      <circle cx="-16.2" cy="-5.3" r="8" fill="#4a2a10"/>
    </g>
    <text transform="translate(332 150) rotate(-90)" text-anchor="middle" font-family="'Arial Black', 'Arial', 'Helvetica', sans-serif" font-size="15" font-weight="900" letter-spacing="3" fill="#3d200b">STREAMLIST</text>
    <path d="M352 89 Q352 96 359 96 Q352 96 352 103 Q352 96 345 96 Q352 96 352 89 Z" fill="#fff" opacity="0.9"/>
  </g>
</svg>
