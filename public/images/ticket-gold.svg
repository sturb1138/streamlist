    <text transform="translate(332 150) rotate(-90)" text-anchor="middle" font-family="'Arial Black', 'Arial', 'Helvetica', sans-serif" font-size="15" font-weight="900" letter-spacing="3" fill="#2f3740">STREAMLIST</text>
    <path d="M352 88 Q352 96 360 96 Q352 96 352 104 Q352 96 344 96 Q352 96 352 88 Z" fill="#fff" opacity="0.9"/><path d="M64 226 Q64 232 70 232 Q64 232 64 238 Q64 232 58 232 Q64 232 64 226 Z" fill="#fff" opacity="0.9"/>
